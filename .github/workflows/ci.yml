name: CI

env:
  LVCE_ELECTRON_VERSION: v0.113.19

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm run build:static
      - run: npm test
      - run: npm run test-integration
      - run: npm run type-check
      - run: npm run lint
      - name: install playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e
        working-directory: ./packages/e2e
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Cache Electron app
        uses: actions/cache@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          path: packages/e2e/.test-with-playwright/electron
          key: ${{ runner.os }}-simple-browser-electron-${{ env.LVCE_ELECTRON_VERSION }}
      - name: Electron e2e
        if: matrix.os == 'ubuntu-24.04'
        working-directory: ./packages/e2e
        run: xvfb-run -a npm run e2e:electron
      - name: Start PulseAudio
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes pulseaudio
          pulseaudio --start --exit-idle-time=-1
      - name: Audio indicator Electron e2e
        if: matrix.os == 'ubuntu-24.04'
        working-directory: ./packages/e2e
        run: xvfb-run -a npm run e2e:electron -- --filter=simple-browser.audio-tab-indicator --electron-version=$LVCE_ELECTRON_VERSION --electron-arg=--alsa-output-device=pulse
        env:
          RUN_AUDIO_INDICATOR_E2E: '1'
      - name: Upload Electron failure traces
        if: ${{ failure() && matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@v4
        with:
          name: simple-browser-electron-traces
          path: packages/e2e/.test-with-playwright/artifacts
          if-no-files-found: ignore
      - name: measure
        run: npm run measure
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Upload artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.tmp/static
      - name: Clean up
        run: rm -rf .tmp
        shell: bash

  wayland:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WAYLAND_DISPLAY: wayland-1
      XDG_RUNTIME_DIR: /tmp/lvce-wayland-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - name: Install Weston
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes wayland-utils weston
      - name: Start Weston
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --renderer=pixman --width=1920 --height=1080 --socket="$WAYLAND_DISPLAY" --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/weston.pid"
          for attempt in {1..30}; do
            if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then
              break
            fi
            sleep 1
          done
          if ! test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          fi
          wayland-info > "$RUNNER_TEMP/wayland-info.log"
      - name: Wayland Electron e2e
        working-directory: ./packages/e2e
        env:
          DEBUG: pw:browser
        run: |
          set -o pipefail
          unset DISPLAY
          echo "Running Electron with --ozone-platform=wayland and no DISPLAY"
          npm run e2e:electron -- \
            --electron-arg=--no-sandbox \
            --electron-arg=--disable-gpu \
            --electron-arg=--ozone-platform=wayland \
            --electron-arg=--ozone-platform-hint=wayland \
            --electron-env=WAYLAND_DISPLAY=$WAYLAND_DISPLAY \
            --electron-env=WAYLAND_DEBUG=1 2>&1 | tee "$RUNNER_TEMP/wayland-electron.log"
      - name: Upload Wayland logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: simple-browser-wayland-logs
          path: |
            ${{ runner.temp }}/weston.log
            ${{ runner.temp }}/wayland-info.log
            ${{ runner.temp }}/wayland-electron.log
            packages/e2e/.test-with-playwright/artifacts
          if-no-files-found: ignore
      - name: Stop Weston
        if: ${{ always() }}
        run: |
          if test -f "$RUNNER_TEMP/weston.pid"; then
            kill "$(cat "$RUNNER_TEMP/weston.pid")" 2>/dev/null || true
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: [ci, wayland]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
