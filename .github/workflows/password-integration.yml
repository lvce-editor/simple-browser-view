name: Password integration

on:
  pull_request:
    branches: [main]

jobs:
  passwords:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LVCE_SOURCE_ROOT: ${{ github.workspace }}/.fixtures/lvce-editor
    steps:
      - uses: actions/checkout@v7
      - name: Checkout application with password toolbar
        uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: 1fdefd9d3b513bb2f2f7e6eec8e676c68da21897
          path: .fixtures/lvce-editor
      - uses: actions/setup-node@v6
        with:
          node-version-file: .fixtures/lvce-editor/.nvmrc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v6
        with:
          path: .fixtures/lvce-editor/**/node_modules
          key: ${{ runner.os }}-password-integration-${{ hashFiles('.fixtures/lvce-editor/**/package-lock.json') }}
      - name: Install application fixture
        working-directory: .fixtures/lvce-editor
        run: node packages/build/src/parts/InstallDependencies/InstallDependencies.ts
      - name: Install Electron and OS keyring
        run: |
          node .fixtures/lvce-editor/packages/main-process/node_modules/electron/install.js
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gnome-keyring dbus-x11
      - name: Password lifecycle through the toolbar
        run: xvfb-run -a node packages/e2e/integration/test-simple-browser-passwords.mjs
